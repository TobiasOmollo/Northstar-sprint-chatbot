<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar · Support Deflector</title>
  <!-- Font & icons for clean look -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* style.css – embedded for single-file MVP, but kept as separate block per spec */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f4f6fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .dashboard {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      overflow: hidden;
      padding: 2rem 2rem 2.5rem;
      transition: 0.2s;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .brand i {
      font-size: 2rem;
      color: #0b2b5c;
      background: #eef2f9;
      padding: 0.5rem;
      border-radius: 14px;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0b2b5c;
    }

    .brand span {
      font-weight: 400;
      color: #4a5b7a;
      font-size: 0.9rem;
      margin-left: 0.2rem;
    }

    .subhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .subhead p {
      color: #2c3e5c;
      background: #f0f4fe;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .subhead i {
      margin-right: 6px;
      color: #1d4ed8;
    }

    .chat-panel {
      background: #f9fafc;
      border-radius: 1.4rem;
      padding: 1.5rem 1.5rem 0.25rem;
      border: 1px solid #e9edf4;
    }

    .response-area {
      background: white;
      border-radius: 1.2rem;
      padding: 1.25rem 1.5rem;
      min-height: 120px;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
      border: 1px solid #e2e8f0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      font-size: 0.98rem;
      line-height: 1.6;
      color: #1f2a44;
    }

    .response-area .empty-state {
      color: #8b9ab5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }

    .response-area .empty-state i {
      font-size: 1.3rem;
      color: #b3c2db;
    }

    .response-area .bot-message {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .response-area .bot-message i {
      color: #1d4ed8;
      background: #e6edfe;
      padding: 0.4rem;
      border-radius: 10px;
      font-size: 1rem;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .quick-actions button {
      background: white;
      border: 1px solid #dbe0e9;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1f2a44;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .quick-actions button:hover {
      background: #eef3fc;
      border-color: #b0c4e0;
      transform: scale(0.97);
    }

    .quick-actions button i {
      margin-right: 6px;
      color: #3b5a8a;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background: white;
      padding: 0.4rem 0.4rem 0.4rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #d8e0ec;
      transition: 0.2s;
    }

    .input-row:focus-within {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    }

    .input-row input {
      flex: 1;
      border: none;
      outline: none;
      padding: 0.7rem 0;
      font-size: 0.95rem;
      background: transparent;
      color: #0f1a33;
    }

    .input-row input::placeholder {
      color: #94a9c9;
      font-weight: 400;
    }

    .input-row button {
      background: #0b2b5c;
      border: none;
      color: white;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #1a3f74;
      transform: scale(0.97);
    }

    .policy-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6b7f9f;
      border-top: 1px solid #e6ecf5;
      padding-top: 1.25rem;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .policy-note i {
      margin: 0 4px;
      color: #8da0c2;
    }

    /* small extras */
    .highlight-badge {
      background: #d9e5fc;
      color: #10316b;
      font-weight: 500;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      font-size: 0.75rem;
    }

    .response-area .msg-item {
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #f0f3f9;
      padding-bottom: 0.5rem;
    }

    .response-area .msg-item:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .flex-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="brand">
      <i class="fas fa-compass"></i>
      <h1>Northstar<span> · support deflector</span></h1>
    </div>
    <div class="subhead">
      <p><i class="fas fa-robot"></i> Ask about order status, returns & refunds</p>
      <span class="highlight-badge"><i class="far fa-clock"></i> 30-day policy</span>
    </div>

    <div class="chat-panel">
      <!-- response display (chatbot output) -->
      <div id="responseDisplay" class="response-area">
        <div class="empty-state" id="emptyState">
          <i class="fas fa-comment-dots"></i>
          <span>Hi, I’m Northstar’s self-service assistant. Ask about an order or return.</span>
        </div>
        <div id="chatMessages" style="display: none;"></div>
      </div>

      <!-- quick action buttons -->
      <div class="quick-actions">
        <button onclick="quickAsk('order status for #1001')"><i class="fas fa-box"></i> Order #1001</button>
        <button onclick="quickAsk('return policy for order #1002')"><i class="fas fa-undo-alt"></i> Return #1002</button>
        <button onclick="quickAsk('refund for order #1003')"><i class="fas fa-dollar-sign"></i> Refund #1003</button>
        <button onclick="quickAsk('when will I get my refund')"><i class="fas fa-clock"></i> Refund timeline</button>
      </div>

      <!-- input row -->
      <div class="input-row">
        <input type="text" id="userInput" placeholder="e.g. 'Where is order #1004?' or 'return policy'" />
        <button id="sendBtn"><i class="fas fa-paper-plane"></i> Ask</button>
      </div>
    </div>
    <div class="policy-note">
      <i class="fas fa-shield-alt"></i> based on Northstar internal policy · 30-day window · final sale exceptions
    </div>
  </div>

  <script>
    // ========== app.js – UI logic + chatbot wiring (MVP) ==========
    // (orderLookup, returnEligibility, intent matchers are embedded)

    // ----- mock dataset (orderLookup) -----
    const orderDB = [
      { orderId: '1001', status: 'Delivered', deliveryDate: '2026-07-22', shipDate: '2026-07-18', items: ['Bluetooth speaker', 'charging cable'] },
      { orderId: '1002', status: 'Shipped', deliveryDate: null, shipDate: '2026-08-10', items: ['wool sweater', 'scarf'] },
      { orderId: '1003', status: 'Processing', deliveryDate: null, shipDate: null, items: ['wireless earbuds'] },
      { orderId: '1004', status: 'Delivered', deliveryDate: '2026-08-01', shipDate: '2026-07-29', items: ['yoga mat', 'resistance bands'] },
      { orderId: '1005', status: 'Shipped', deliveryDate: null, shipDate: '2026-08-12', items: ['leather wallet'] },
      { orderId: '1006', status: 'Delivered', deliveryDate: '2026-07-30', shipDate: '2026-07-27', items: ['smart watch'] },
    ];

    // final sale SKUs (non-returnable)
    const finalSaleSKUs = ['earrings-gold', 'underwear-pack', 'gift-card-50', 'custom-monogram-bag', 'beauty-serum-opened'];

    // ----- orderLookup.js -----
    function lookupOrder(orderId) {
      const id = orderId.trim().replace('#', '').toUpperCase();
      const order = orderDB.find(o => o.orderId === id);
      if (!order) return null;
      return { ...order };
    }

    // ----- returnEligibility.js (based on policy) -----
    function checkReturnEligibility(orderId, daysSinceDelivery = null, condition = 'unused', isFinalSale = false) {
      const order = lookupOrder(orderId);
      if (!order) return { eligible: false, reason: 'Order not found' };

      // final sale override
      const hasFinalSaleItem = order.items.some(item => finalSaleSKUs.some(sku => item.toLowerCase().includes(sku.toLowerCase())));
      if (hasFinalSaleItem || isFinalSale) {
        return { eligible: false, reason: 'Final sale item — not returnable (see policy Section 4)' };
      }

      // window check: 30 days from delivery (or ship date for pre-order/backorder, but we simplify)
      if (order.deliveryDate) {
        const delivery = new Date(order.deliveryDate);
        const now = new Date();
        const diffDays = Math.floor((now - delivery) / (1000 * 60 * 60 * 24));
        if (diffDays > 30) {
          return { eligible: false, reason: `Return window exceeded (${diffDays} days). Policy: 30 days from delivery.` };
        }
      } else if (order.shipDate) {
        // if not delivered yet, but shipped: use shipDate as reference (pre-order/backorder)
        const ship = new Date(order.shipDate);
        const now = new Date();
        const diffDays = Math.floor((now - ship) / (1000 * 60 * 60 * 24));
        if (diffDays > 30) {
          return { eligible: false, reason: `30-day window from ship date exceeded (${diffDays} days).` };
        }
      } else {
        // processing / not shipped
        return { eligible: false, reason: 'Order not yet shipped. Contact support if urgent.' };
      }

      // condition checks (sellable standard)
      if (condition === 'washed' || condition === 'stained' || condition === 'odor') {
        return { eligible: false, reason: 'Item does not meet "sellable" standard (washed/stains/odor). See Section 3 & 5.' };
      }
      if (condition === 'damaged packaging') {
        return { eligible: true, partial: true, refundPercent: 85, note: 'Damaged packaging — 85% partial refund.' };
      }
      if (condition === 'missing accessories') {
        return { eligible: true, partial: true, refundPercent: 75, note: 'Missing accessories — 75% partial refund.' };
      }
      if (condition === 'visible wear') {
        return { eligible: true, partial: true, refundPercent: 50, note: 'Visible wear — 50% partial refund.' };
      }

      // default: full refund eligible
      return { eligible: true, refundPercent: 100, note: 'Eligible for full refund to original payment method.' };
    }

    // ----- intents (matching) -----
    function matchOrderStatusIntent(input) {
      const lower = input.toLowerCase();
      // check for order id pattern
      const matchId = lower.match(/#?(\d{4,5})/);
      if (!matchId) return null;
      const orderId = matchId[1];
      const order = lookupOrder(orderId);
      if (!order) return { intent: 'orderStatus', reply: `Order #${orderId} not found. Please check the number.` };
      
      let statusReply = `Order #${orderId}: **${order.status}**. `;
      if (order.deliveryDate) statusReply += `Delivered on ${order.deliveryDate}. `;
      else if (order.shipDate) statusReply += `Shipped on ${order.shipDate}. `;
      else statusReply += `Processing — not yet shipped. `;
      statusReply += `Items: ${order.items.join(', ')}.`;
      return { intent: 'orderStatus', reply: statusReply };
    }

    function matchReturnRefundIntent(input) {
      const lower = input.toLowerCase();
      // check for order id
      const matchId = lower.match(/#?(\d{4,5})/);
      let orderId = matchId ? matchId[1] : null;

      // if no order id, try to extract from "order #1001" pattern
      if (!orderId) {
        const idFromText = lower.match(/order\s*#?(\d{4,5})/);
        if (idFromText) orderId = idFromText[1];
      }

      // if still no order id, return a general policy reply
      if (!orderId) {
        if (lower.includes('refund')) {
          return { intent: 'returnRefund', reply: 'Refunds are processed within 48h of return scan, then 3-5 business days to card. For store credit, instant upon scan. See policy Section 8.' };
        }
        if (lower.includes('return policy') || lower.includes('return') || lower.includes('eligible')) {
          return { intent: 'returnRefund', reply: 'Northstar 30-day return window from delivery. Items must be unused with original packaging. Final sale items (jewelry, undergarments, digital goods) are not returnable. See Sections 3 & 4.' };
        }
        return null;
      }

      // order exists? 
      const order = lookupOrder(orderId);
      if (!order) {
        return { intent: 'returnRefund', reply: `Order #${orderId} not found. Please check the number.` };
      }

      // detect condition/context from input
      let condition = 'unused';
      if (lower.includes('washed') || lower.includes('shrink')) condition = 'washed';
      else if (lower.includes('stain') || lower.includes('odor')) condition = 'stained';
      else if (lower.includes('packaging') || lower.includes('box')) condition = 'damaged packaging';
      else if (lower.includes('missing') || lower.includes('accessory')) condition = 'missing accessories';
      else if (lower.includes('wear') || lower.includes('scuff')) condition = 'visible wear';

      // check final sale via items (mock)
      const hasFinal = order.items.some(it => finalSaleSKUs.some(sku => it.toLowerCase().includes(sku.toLowerCase())));
      const eligibility = checkReturnEligibility(orderId, null, condition, hasFinal);

      let reply = `Order #${orderId}: `;
      if (!eligibility.eligible) {
        reply += eligibility.reason;
      } else if (eligibility.partial) {
        reply += `Return eligible (partial). ${eligibility.note}`;
      } else {
        reply += `Return eligible. ${eligibility.note}`;
      }
      // add return instructions
      if (eligibility.eligible) {
        reply += ` To initiate, contact support or use self-service portal.`;
      }
      return { intent: 'returnRefund', reply };
    }

    // ----- master chatbot router (chatbot.js) -----
    function processUserInput(input) {
      if (!input || input.trim().length === 0) return 'Please ask a question about your order or return.';

      const trimmed = input.trim();
      // try order status first
      const statusResult = matchOrderStatusIntent(trimmed);
      if (statusResult) return statusResult.reply;

      // try return/refund
      const returnResult = matchReturnRefundIntent(trimmed);
      if (returnResult) return returnResult.reply;

      // fallback: policy summary
      return `I can help with order status, returns, and refunds. Try "order #1001" or "return policy". For detailed policy, see Northstar 30-day window and final sale exceptions.`;
    }

    // ----- UI logic (app.js) -----
    const responseArea = document.getElementById('responseDisplay');
    const emptyState = document.getElementById('emptyState');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function displayResponse(text) {
      // hide empty state, show messages container
      emptyState.style.display = 'none';
      chatMessages.style.display = 'block';

      // create message element
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-item bot-message';
      msgDiv.innerHTML = `<i class="fas fa-robot"></i><span>${text.replace(/\n/g, '<br>')}</span>`;
      
      // append and keep scroll
      chatMessages.appendChild(msgDiv);
      responseArea.scrollTop = responseArea.scrollHeight;
    }

    function clearAndDisplay(text) {
      // clear previous messages (keep only the new one)
      chatMessages.innerHTML = '';
      chatMessages.style.display = 'block';
      emptyState.style.display = 'none';
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg-item bot-message';
      msgDiv.innerHTML = `<i class="fas fa-robot"></i><span>${text.replace(/\n/g, '<br>')}</span>`;
      chatMessages.appendChild(msgDiv);
      responseArea.scrollTop = 0;
    }

    function handleSubmit() {
      const raw = userInput.value.trim();
      if (!raw) return;
      const reply = processUserInput(raw);
      clearAndDisplay(reply);
      userInput.value = '';
    }

    // Quick action helper
    window.quickAsk = function(phrase) {
      userInput.value = phrase;
      handleSubmit();
    };

    // Event listeners
    sendBtn.addEventListener('click', handleSubmit);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSubmit();
    });

    // initial example
    setTimeout(() => {
      clearAndDisplay('👋 Welcome! I’m Northstar’s self-service assistant. Ask about your order (e.g. "order #1001") or return/refund policy. Quick buttons above.');
    }, 200);
  </script>
</body>
</html>
