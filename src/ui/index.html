<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar · Support Deflector</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <div class="brand">
      <i class="fas fa-compass"></i>
      <h1>Northstar<span> · support deflector</span></h1>
    </div>
    <div class="subhead">
      <p><i class="fas fa-robot"></i> Ask about order status, returns & refunds</p>
      <span class="highlight-badge"><i class="far fa-clock"></i> 30-day policy</span>
    </div>

    <div class="chat-panel">
      <!-- response display (chatbot output) -->
      <div id="responseDisplay" class="response-area">
        <div class="empty-state" id="emptyState">
          <i class="fas fa-comment-dots"></i>
          <span>Hi, I'm Northstar's self-service assistant. Ask about an order or return.</span>
        </div>
        <div id="chatMessages" style="display: none;"></div>
      </div>

      <!-- quick action buttons — phrases match the tested intent patterns
           and ORD#### ID format from mock_order_dataset.csv -->
      <div class="quick-actions">
        <button onclick="quickAsk('where\'s my order ORD1001')"><i class="fas fa-box"></i> Order ORD1001</button>
        <button onclick="quickAsk('how do I return ORD1003')"><i class="fas fa-undo-alt"></i> Return ORD1003</button>
        <button onclick="quickAsk('when\'s my refund for ORD1008')"><i class="fas fa-dollar-sign"></i> Refund ORD1008</button>
        <button onclick="quickAsk('when\'s my refund')"><i class="fas fa-clock"></i> Refund timeline</button>
      </div>

      <!-- input row -->
      <div class="input-row">
        <input type="text" id="userInput" placeholder="e.g. 'where's my order ORD1001' or 'how do I return this'" />
        <button id="sendBtn"><i class="fas fa-paper-plane"></i> Ask</button>
      </div>
    </div>
    <div class="policy-note">
      <i class="fas fa-shield-alt"></i> based on Northstar internal policy · 30-day window
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
